dependenceList: []
outDir: build
miscInfo:
  uid: ""
targets:
  Debug:
    cppPreprocessAttrs:
      defineList:
        - PY32E407xE
        - USE_HAL_DRIVER
      incList:
        - ../Core/INC
        - ../Middlewares/Third_Party/LwIP/include/lwip
        - ../Middlewares/Third_Party/LwIP/include/lwip/apps
        - ../Middlewares/Third_Party/LwIP/include/lwip/priv
        - ../Middlewares/Third_Party/LwIP/include/lwip/prot
        - ../Middlewares/Third_Party/LwIP/include/netif
        - ../Middlewares/Third_Party/LwIP/include/compat
        - ../Middlewares/Third_Party/LwIP
        - ../Middlewares/Third_Party/LwIP/arch
        - ../Middlewares/Third_Party/LwIP/include
        - ../Middlewares/Third_Party/LwIP/system
        - ../Drivers/CMSIS/Include
        - ../Drivers/PY32E407_HAL_Driver/Inc
        - ../Drivers/CMSIS/Device/PY32E407/Include
      libList: []
    excludeList: []
    settings:
      debugger: cortex-debug
    toolchain: GCC
    toolchainConfigMap:
      GCC:
        archExtensions: ""
        cpuType: Cortex-M4
        floatingPointHardware: single
        options:
          version: 5
          afterBuildTasks: []
          asm-compiler:
            ASM_FLAGS: ""
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: ""
            C_FLAGS: ""
            language-c: c11
            language-cpp: c++11
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-debug
            warnings: all-warnings
          global:
            $float-abi-type: hard
            misc-control: --specs=nosys.specs --specs=nano.specs -mfloat-abi=hard -mfpu=fpv4-sp-d16
            output-debug-info: enable
          linker:
            $toolName: auto
            LD_FLAGS: " "
            LIB_FLAGS: -lm
            output-format: elf
            remove-unused-input-sections: true
        scatterFilePath: PY32E407V1ET7.ld
        storageLayout:
          RAM: []
          ROM: []
        useCustomScatterFile: true
    uploadConfigMap:
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: PY32E407xE
          endor: Puya
        otherCmds: ""
        proType: 1
        speed: 1000
      OpenOCD:
        baseAddr: "0x08000000"
        bin: ""
        interface: cmsis-dap
        target: py32e407
      pyOCD:
        baseAddr: "0x08000000"
        bin: ""
        config: .eide/debug.pyocd.yaml
        otherCmds: '"--pack=${env:PYSDEPATH}/packs/PY32E4xx_DFP.pack"'
        speed: 4M
        targetName: PY32E407xE
    uploader: pyOCD
